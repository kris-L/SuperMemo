<p>如何牢记别人的手机号码？</p>
<p>联通手机号码开头数字130、131、132、155、156、185、186</p>
<p>移动手机号码开头数字134、135、136、137、138、139、147、</p>
<p>150、151、152、157、158、159、182、187、188</p>
<p>电信手机号码开头数字133、153、180、189</p>
<p>一般来说，通过超级记忆吧记忆力训练系统数字谐音桩、三十六计、走遍中国路线桩、圆周率1000位从头到尾编码并记忆等训练下来，一般的数字记忆都不成问题了，手机号码记忆更是简单。只要注意记忆格式就好（手机号开头三位数+后八位数或者是开头1不用记+后十位数）。</p>
